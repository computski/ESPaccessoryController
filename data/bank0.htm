    <script type="text/javascript">
      //let wsUri = "wss://echo.websocket.org/";  //test mode only
      let wsUri = "ws://192.168.6.1:12080/";
	let ws;

        //define JSON send-receive objects

        let bank = { "page": "bank0", "action": "poll", pins:[
{"mode":"Servo","pin":0,"addr":0,"invert":false,"cont":false,"swing":25,"rate":0,"MASstate":127,"state":"x","MASarray":"FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF"},
{"mode":"MAS","pin":1,"addr":33,"invert":false,"cont":false,"swing":45,"rate":0,"MASstate":127,"state":"Closed","MASarray":"0001020304050607A1A2A3A4A5A6A7a8B1B2B3B4B5B6B7B8C1C2C3C4C5C6C7C8"}

]};
	let hardware = {"wsUri":"ws://192.168.6.1:81/"};
        //if action=fail this indicates the changes were not successful and the current settings are returned

      //****** common routine
        var attempts = 0;

        //We try twice to pull the ESP specific wsUri, if we fail
        //then we fall back to the default wsUri defined above.
        function boot() {
            if (attempts > 10) { return; }
            attempts++;
            if (attempts > 2) {
                //connect anyway to the default wsUri
                initWebsocket();
            } else {
                //try and pull the websocket addr from the server
                httpGet("/hardware");
                //and call self again to check we are done
                setTimeout(function () { boot(); }, 3000);
            }
          }


        function httpGet(theUrl) {
            if (window.XMLHttpRequest) {// code for IE7+, Firefox, Chrome, Opera, Safari
                xmlhttp = new XMLHttpRequest();
            }
            else {// code for IE6, IE5
                xmlhttp = new ActiveXObject("Microsoft.XMLHTTP");
            }
            xmlhttp.onreadystatechange = function () {
                try {
                    if (xmlhttp.readyState == 4 && xmlhttp.status == 200) {
                        if (console) { console.log(xmlhttp.responseText) };

                        hardware = JSON.parse(xmlhttp.responseText);
                        wsUri=hardware.wsUri;
                         if (console) console.log(wsUri);
                        //connect to the websocket provided by the ESP server
                        initWebsocket();
                    }
                }
                catch (e) {
                    if (console) console.log(e.message);
                }
            }
            //XMLHttpRequest.open(method, url[, async[, user[, password]]])
            xmlhttp.open("GET", theUrl, true);
            //calling syc requests on main thread is deprecated due to response lock-ups
            //in our case we need to know the response before we can initialise the websocket
            xmlhttp.send();

            //now call boot again after 3 sec

        }



        function initWebsocket() {
	//do not open another socket if one is already active
	if (ws && ws.readyState === WebSocket.OPEN) return;
            if (console) { console.log("initWebsocket") };
            
            ws = new WebSocket(wsUri);
            ws.onopen = function (evt) { onOpen(evt) };
            ws.onclose = function (evt) { onClose(evt) };
            ws.onmessage = function (evt) {  onMessage(evt)};
            ws.onerror = function (evt) { onError(evt) };
        }

        //can use open/close to set a green/red connection flag
        function onOpen(evt) {
            if (console) {console.log("websocket open");}
              //send a poll 
             setBank("poll");
        }

        function onClose(evt) {
            if (console) {  console.log("websocket close");}
         }

        function onError(evt) {
	ws.close();
            if (console) { console.log("websocket error");   }         
          }


        function onMessage(evt) {
try{
		console.log(evt.data);
  		bank = JSON.parse(evt.data);
                repaintUI();

}catch(e){
if (console) console.log("parse error");
}
        }



function repaintRow(r){
//repaints a table row mindful of the mode. r is the row index starting at 0
//if user changes a row mode, we repaint the row based on cached data
//if user changes a cell we flag the row as dirty and pending a websocket write

//mode determines field masking
//Servo: addr swing invert continuous rate.
//Sensor: addr invert
//Aspect: addr invert
//MAS: add invert Mas-fields
//I2C and heartbeat suppress all
//mode: Servo|Sensor|Aspect|MAS|I2C|Heartbeat

//three mask modes. classList can .add|.remove|.toggle
let isServo=false;
let isMAS=false;
let isSystem=false;

let inputs = document.getElementsByName('pin[]');
inputs[r].innerText=bank.pins[r].pin;  

inputs = document.getElementsByName('mode[]');
inputs[r].value=bank.pins[r].mode;  //default behaviour but overriden in switch

switch (bank.pins[r].mode)
{
case "I2C":
	isSystem=true;
	//set a single value and disable dropdown
	inputs[r].length = 0;
	const newOption = document.createElement("option");
	newOption.text=bank.pins[r].mode;
	newOption.value=bank.pins[r].mode;
	inputs[r].appendChild(newOption);
	inputs[r].disabled=true;
	break;

case "Servo":
	//special case pin 0, Servo is actually Heartbeat which isSystem
	isSystem = r==0?true:false;
	isServo = r==0?false:true;

	break;

case "MAS":
	isMAS=true;
	break;

case "Sensor":
case "SensorW":
	//special case pin 9, is always a Sensor, really we want to remove the other options
	if (r!=9) break;
	inputs[r].querySelector('[value="MAS"]')?.remove();
	inputs[r].querySelector('[value="Servo"]')?.remove();
	//inputs[r].querySelector('[value="SensorW"]')?.remove();  //don't remove this. server will take care of it
	inputs[r].querySelector('[value="Aspect"]')?.remove();
}


inputs = document.getElementsByName('addr[]');
inputs[r].value=bank.pins[r].addr;
if (isSystem) {inputs[r].classList.add('nominal')}else{inputs[r].classList.remove('nominal')};


inputs = document.getElementsByName('swing[]');
inputs[r].value=bank.pins[r].swing;
if (isServo) {inputs[r].classList.remove('nominal')}else{inputs[r].classList.add('nominal')};

inputs = document.getElementsByName('invert[]');
inputs[r].checked=bank.pins[r].invert;
if (isSystem) {inputs[r].classList.add('nominal')}else{inputs[r].classList.remove('nominal')};

inputs = document.getElementsByName('cont[]');
inputs[r].checked=bank.pins[r].cont;
if (isServo) {inputs[r].classList.remove('nominal')}else{inputs[r].classList.add('nominal')};

inputs = document.getElementsByName('rate[]');
inputs[r].value=bank.pins[r].rate;
if (isServo) {inputs[r].classList.remove('nominal')}else{inputs[r].classList.add('nominal')};

inputs = document.getElementsByName('MASh[]');
inputs[r].value=decodeMAS(bank.pins[r].MASarray,0);
if (isMAS) {inputs[r].classList.remove('nominal')}else{inputs[r].classList.add('nominal')};

inputs = document.getElementsByName('MASl[]');
inputs[r].value=decodeMAS(bank.pins[r].MASarray,1);
if (isMAS) {inputs[r].classList.remove('nominal')}else{inputs[r].classList.add('nominal')};

inputs = document.getElementsByName('MAShF[]');
inputs[r].value=decodeMAS(bank.pins[r].MASarray,2);
if (isMAS) {inputs[r].classList.remove('nominal')}else{inputs[r].classList.add('nominal')};

inputs = document.getElementsByName('MASlF[]');
inputs[r].value=decodeMAS(bank.pins[r].MASarray,3);
if (isMAS) {inputs[r].classList.remove('nominal')}else{inputs[r].classList.add('nominal')};

//display state or MASstate or neither
inputs = document.getElementsByName('state[]');
inputs[r].innerText=bank.pins[r].state;  //default
if (isMAS) inputs[r].innerText=bank.pins[r].MASstate;
if (isSystem) inputs[r].innerText="";

if (console) console.log("repaint "+r);
}


//converts part of 64 char hex arr to one of the MAS control blocks 0 thro 3
//returning this as space separated integers
function decodeMAS(arr,block){
	let out="";
	for (i=block*16;i<16+(block*16);i=i+2){
	let hex = arr.substring(i,i+2);
	const decimalNum = parseInt(hex, 16); 
	if (decimalNum!=255) out=out+decimalNum+" ";
	}
return out.trim();
}

//encodes txt input expected as decimals separated by spaces into a hex block
function encodeMAS(txt){
	let out=""
	const arrOfValues = txt.split(/[\D]+/);  //delim is non digit e.g. space or comma 
	for (i=0;i<arrOfValues.length;i++){
	//10 is the radix of the input string, parseInt is always trying to generate a base10 value
	let num = parseInt(arrOfValues[i],10);
	if (Number.isNaN(num)) break;
	out = out + num.toString(16).padStart(2,'0');
	if (i>6) break;  //max 8 digit groups
	}

	//pad end with "FF" to make a string 16 chars long  
	return (out.padEnd(16,'F'));
}




        function repaintUI() {

        try {
   	document.getElementById("btnSave").classList.remove('on');
		
	if (bank.page!="bank0") return;
	if (console) console.log("repaintUI");
	for (r=0;r<bank.pins.length;r++){repaintRow(r);}
	return;
	
	//valid actions are poll|write|ok|fail
	switch (bank.action){
		case "ok":
		result.innerText = "write success";
		break;
		case "fail":
		result.innerText = "write failed, check your parameters";
		break;
		case "poll":
		result.innerText ="";
		break;
		default:
		return;
	}

                
            }

            catch (e) {
                if (console) console.log(e.message);
            }
        }


////////////////	WRITE WRITE WRITE //////////////
        function setBank(action) {
//do no validation on client.  the changes are sent up to the server and it does validation

if (action=="write"){
	bank.action="write";
	//copy data from entire table, however only those rows flagged with dirty=true will be processed by server
		for (r=0;r<bank.pins.length;r++){
		var inputs = document.getElementsByName('mode[]');
		bank.pins[r].mode=inputs[r].value

		inputs = document.getElementsByName('addr[]');
		bank.pins[r].addr=inputs[r].value;

		inputs = document.getElementsByName('swing[]');
		bank.pins[r].swing=inputs[r].value;

		inputs = document.getElementsByName('invert[]');
		bank.pins[r].invert=inputs[r].checked;

		inputs = document.getElementsByName('cont[]');
		bank.pins[r].cont=inputs[r].checked;

		inputs = document.getElementsByName('rate[]');
		bank.pins[r].rate=inputs[r].value;

		inputs = document.getElementsByName('MASh[]');
		var arr = encodeMAS(inputs[r].value);	
		inputs = document.getElementsByName('MASl[]');
		arr += encodeMAS(inputs[r].value);
		inputs = document.getElementsByName('MAShF[]');
		arr += encodeMAS(inputs[r].value);
		inputs = document.getElementsByName('MASlF[]');
		arr += encodeMAS(inputs[r].value);

		bank.pins[r].MASarray=arr;

		//we don't sent 'state' or any other instruction per row
		}

	}
else
{bank.action="poll";}

        var myJSON = JSON.stringify(bank);
debug.innerText=myJSON;
	ws.send(myJSON);

}



//can use this rather than body onload

function scooby(){
//ESP8266webserver has problems with files >21kb.  So we will build the table onload
const table = document.getElementById('table1');
const tbody = table.querySelector("tbody") || table;
const sourceRow = tbody.rows[1];
for (i=0;i<7;i++){
const clonedRow = sourceRow.cloneNode(true);
tbody.appendChild(clonedRow);
}

//adjunct boot activity, add event listners
// Listen for any 'input' or 'change' events bubbling up from cells
table.addEventListener('input', (event) => {
    // Find the cell (<td>) that triggered the change
    const cell = event.target.closest('td');
    
//note that data rows are base 1 because header is row 0
    if (cell) {
        console.log(`Cell changed! Row index: ${cell.parentNode.rowIndex}, Column index: ${cell.cellIndex}`);
        console.log(`New Value:`, event.target.value || cell.textContent);
        
        // Add a visual indicator or tracking attribute
         document.getElementById("btnSave").classList.add('on');
	//flag row as dirty
	bank.pins[cell.parentNode.rowIndex-1].dirty=true;

if (cell.cellIndex==0) {
//special case for mode column, update the bank JSON object and repaint this row
bank.pins[cell.parentNode.rowIndex-1].mode=event.target.value;
repaintRow(cell.parentNode.rowIndex-1);
}


    }
});


return;

}
